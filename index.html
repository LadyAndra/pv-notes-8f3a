<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Prairie Village</title>

<!-- Fill the phone screen, no zooming, respect the notch -->
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">

<!-- Makes it open full-screen when added to the Home Screen on iPhone/iPad -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Prairie Village">
<meta name="theme-color" content="#5d8f42">

<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">

<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #5d8f42;
    /* stop iOS from scrolling, bouncing, or zooming while you play */
    overscroll-behavior: none;
    touch-action: none;
    -webkit-user-select: none;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }

  /* The artwork fills the WHOLE screen, corner to corner, and draws
     underneath the notch and the home bar.

     This used to be inset on three sides to keep the playfield clear
     of the notch. That worked, but on a notched iPhone in landscape
     the notch spacing is 62px on EACH side — so it read as a thick
     border framing the game, which is what we were chasing.

     Now the picture runs edge to edge instead, and the notch is
     handled where it actually matters: the buttons, joystick, menus
     and text all keep themselves inside the safe area, so nothing
     you need to see or tap is ever hidden behind the notch or the
     home bar. The grass simply carries on underneath it.

     The measurements themselves are read out below and handed to
     the game as window.PV_SAFE. */
  #game {
    position: absolute;
    inset: 0;
    box-sizing: border-box;
  }

  /* An invisible ruler. Its padding is set to the notch/home-bar
     measurements, which the game then reads off it in plain numbers.
     CSS is the only thing that can see those measurements, so this
     is how we get them across to the game. */
  #safeprobe {
    position: fixed;
    left: 0;
    top: 0;
    width: 0;
    height: 0;
    visibility: hidden;
    pointer-events: none;
    padding-left: env(safe-area-inset-left, 0px);
    padding-right: env(safe-area-inset-right, 0px);
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  /* The game canvas must COVER this box exactly, always.

     Phaser sizes the canvas itself by measuring #game once and
     writing that number onto the canvas. If those two ever drift
     apart — and on the installed iPad app they did, because the
     window is still settling into its launch size at the moment
     Phaser takes its one measurement — Phaser never notices. Its
     size-watcher only asks "has #game changed since I last looked?",
     never "does the canvas still match #game?". So a canvas that
     came out slightly too small stayed slightly too small for the
     whole session, and the green backdrop showed around it.

     These four lines make that impossible to see: whatever number
     Phaser writes on the canvas, the canvas is still stretched to
     fill this box corner to corner. Belt and braces alongside the
     re-measure in game.js. */
  #game > canvas {
    display: block;
    position: absolute;
    left: 0;
    top: 0;
    width: 100%;
    height: 100%;
    margin: 0;
  }

  /* ---- "Please turn your phone" screen -------------------------
     iPhones don't let a website force itself into landscape, so
     instead we simply refuse to play in portrait and ask nicely. */
  #rotate {
    position: fixed;
    inset: 0;
    display: none;
    z-index: 9999;
    background: #3d6b2c;
    color: #f2e4c8;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    /* 24px, plus whatever the notch and home bar need, so the words
       are never tucked behind the Dynamic Island in portrait. */
    padding: calc(24px + env(safe-area-inset-top, 0px))
             calc(24px + env(safe-area-inset-right, 0px))
             calc(24px + env(safe-area-inset-bottom, 0px))
             calc(24px + env(safe-area-inset-left, 0px));
    box-sizing: border-box;
  }
  #rotate .phone {
    width: 64px;
    height: 104px;
    border: 5px solid #f2e4c8;
    border-radius: 12px;
    margin-bottom: 26px;
    animation: tip 2.2s ease-in-out infinite;
  }
  @keyframes tip {
    0%, 45%  { transform: rotate(0deg); }
    65%, 90% { transform: rotate(-90deg); }
    100%     { transform: rotate(0deg); }
  }
  #rotate h1 { font-size: 20px; margin: 0 0 8px; font-weight: 600; }
  #rotate p  { font-size: 14px; margin: 0; opacity: 0.75; line-height: 1.5; }

  @media (orientation: portrait) {
    #rotate { display: flex; }
  }
</style>
</head>
<body>
<div id="game"></div>
<div id="safeprobe"></div>

<script>
/* Reads the notch / home-bar measurements off the invisible ruler
   above and leaves them where the game can find them, as
   window.PV_SAFE = { left, right, top, bottom } in plain numbers.

   The game uses these to keep the Plant button, the joystick, the
   menus and the message box inside the part of the screen you can
   actually see and reach — while the artwork itself carries on
   underneath the notch.

   Re-read whenever the screen changes, and a few times over the
   first few seconds, because iOS doesn't always report the final
   numbers the instant a home-screen app launches. */
(function readSafeArea() {
  const probe = document.getElementById('safeprobe');

  window.PV_SAFE = { left: 0, right: 0, top: 0, bottom: 0 };

  function read() {
    if (!probe) return;
    const cs = getComputedStyle(probe);
    const n = (v) => { const f = parseFloat(v); return isFinite(f) ? f : 0; };
    const next = {
      left: n(cs.paddingLeft),
      right: n(cs.paddingRight),
      top: n(cs.paddingTop),
      bottom: n(cs.paddingBottom)
    };
    const was = window.PV_SAFE;
    const changed = !was || was.left !== next.left || was.right !== next.right ||
                    was.top !== next.top || was.bottom !== next.bottom;
    window.PV_SAFE = next;

    /* iOS often doesn't report the real notch measurements until a
       moment after a home-screen app launches. When they do arrive,
       the game needs telling, or the buttons would stay where they
       were first put. This shout is what the game listens for. */
    if (changed) {
      window.dispatchEvent(new CustomEvent('pv-safe-change', { detail: next }));
    }
  }

  read();
  window.PV_readSafeArea = read;
  [60, 150, 300, 600, 1000, 1600, 2400, 3500].forEach((ms) => setTimeout(read, ms));
  window.addEventListener('resize', read);
  window.addEventListener('orientationchange', () => setTimeout(read, 120));
  window.addEventListener('pageshow', () => setTimeout(read, 60));
})();
</script>

<div id="rotate">
  <div class="phone"></div>
  <h1>Turn your phone sideways</h1>
  <p>Prairie Village is played in landscape.<br>
     If it won't rotate, swipe down from the top-right<br>
     and switch off Rotation Lock.</p>
</div>

<!-- A little readout for checking the screen-size fix on the iPad.
     Touch the screen with THREE fingers at once to show or hide it.
     Three fingers never happens in normal play (the joystick and the
     action button are two), so it can't go off by accident. It draws
     itself in plain HTML on top of everything and never touches the
     game, so it's safe to leave in — or delete this whole block once
     you're happy the border is gone. -->
<div id="sizecheck"></div>
<style>
  #sizecheck {
    display: none;
    position: fixed;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    z-index: 10000;
    background: rgba(0, 0, 0, 0.85);
    color: #d8f0b0;
    font: 12px/1.5 ui-monospace, Menlo, monospace;
    padding: 14px 18px;
    border-radius: 10px;
    white-space: pre;
    pointer-events: none;
  }
</style>
<script>
(function sizeCheck() {
  const panel = document.getElementById('sizecheck');
  let on = false;

  function inset(side) {
    const probe = document.createElement('div');
    probe.style.cssText =
      'position:fixed;visibility:hidden;height:env(safe-area-inset-' + side + ',0px)';
    document.body.appendChild(probe);
    const v = getComputedStyle(probe).height;
    probe.remove();
    return v;
  }

  function report() {
    const box = document.getElementById('game').getBoundingClientRect();
    const c = document.querySelector('#game > canvas');
    const cr = c ? c.getBoundingClientRect() : null;
    const round = (n) => Math.round(n * 100) / 100;
    const lines = [
      'PRAIRIE VILLAGE — screen check',
      'BUILD 5   (if this does not say BUILD 5,',
      '           the device is still on old files)',
      '',
      'window        ' + innerWidth + ' x ' + innerHeight,
      'screen        ' + screen.width + ' x ' + screen.height,
      'pixel ratio   ' + devicePixelRatio,
      'home-screen   ' + (navigator.standalone === true ? 'yes (installed app)' : 'no (browser tab)'),
      '',
      'play area     ' + round(box.width) + ' x ' + round(box.height),
      'canvas built  ' + (c ? c.width + ' x ' + c.height : '(none yet)'),
      'canvas shown  ' + (cr ? round(cr.width) + ' x ' + round(cr.height) : '-'),
      '',
      'GAP  left   ' + (cr ? round(cr.x - box.x) : '-'),
      'GAP  top    ' + (cr ? round(cr.y - box.y) : '-'),
      'GAP  right  ' + (cr ? round((box.x + box.width) - (cr.x + cr.width)) : '-'),
      'GAP  bottom ' + (cr ? round((box.y + box.height) - (cr.y + cr.height)) : '-'),
      '',
      'safe area   L ' + inset('left') + '  R ' + inset('right'),
      '            T ' + inset('top') + '  B ' + inset('bottom'),
      '',
      'UI kept inside  ' + JSON.stringify(window.PV_SAFE || {}),
      '',
      'All four GAPs should read 0, and the play',
      'area should now match the window exactly.'
    ];
    panel.textContent = lines.join('\n');
  }

  let timer = null;
  function toggle() {
    on = !on;
    panel.style.display = on ? 'block' : 'none';
    clearInterval(timer);
    if (on) { report(); timer = setInterval(report, 500); }
  }

  /* ---- how to summon this panel ------------------------------
     Both of the old ways to open it turned out to be things a
     PLAYER does by accident, which is exactly what a debug panel
     must never be:

       - pressing D was the shortcut on a laptop, but D is also
         "walk right" in the WASD controls, so simply walking
         right threw a wall of developer text over the game
       - three fingers down at once was the shortcut on a tablet,
         but the game already expects several fingers at a time
         (thumb on the joystick, thumb on the action button), so
         a stray third finger or a resting palm would do it in
         the middle of playing

     Both are gone. It now takes something nobody would ever do
     by accident: hold Ctrl and Shift and press D on a laptop, or
     tap the very top-left corner of the screen five times
     quickly on a tablet. That corner is deliberately chosen —
     it's the one part of the screen with no control on it. */

  window.addEventListener('keydown', (e) => {
    if ((e.key === 'd' || e.key === 'D') && e.ctrlKey && e.shiftKey) toggle();
  }, true);

  const CORNER = 60;      // how big the tap target is, in screen pixels
  const WINDOW_MS = 1200; // all five taps have to land inside this
  let taps = [];
  window.addEventListener('touchstart', (e) => {
    const t = e.touches && e.touches[0];
    if (!t) return;
    const now = Date.now();
    // only taps in the top-left corner count, and only recent ones
    if (t.clientX > CORNER || t.clientY > CORNER) { taps = []; return; }
    taps = taps.filter(ts => now - ts < WINDOW_MS);
    taps.push(now);
    if (taps.length >= 5) { taps = []; toggle(); }
  }, { capture: true, passive: true });
})();
</script>

<script src="https://cdn.jsdelivr.net/npm/phaser@3.80.1/dist/phaser.min.js"></script>
<!-- The ?v=3 is a cache-buster. iOS clings hard to files it has
     already downloaded for a home-screen app, and will happily keep
     running last week's game.js forever. Changing this number forces
     it to fetch a fresh copy. Bump it to v=4, v=5 and so on for any
     future update. -->
<script src="game.js?v=11"></script>
</body>
</html>
