<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Prairie Village</title>

<!-- Fill the phone screen, no zooming, respect the notch -->
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">

<!-- Makes it open full-screen when added to the Home Screen on iPhone/iPad -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Prairie Village">
<meta name="theme-color" content="#5d8f42">

<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">

<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #5d8f42;
    /* stop iOS from scrolling, bouncing, or zooming while you play */
    overscroll-behavior: none;
    touch-action: none;
    -webkit-user-select: none;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }

  /* Keep the playfield clear of the notch and the home bar.
     In landscape the notch is on one side, so we inset both. */
  #game {
    position: absolute;
    inset: 0;
    padding-left: env(safe-area-inset-left);
    padding-right: env(safe-area-inset-right);
    padding-bottom: env(safe-area-inset-bottom);
    box-sizing: border-box;
  }
  canvas { display: block; }

  /* ---- "Please turn your phone" screen -------------------------
     iPhones don't let a website force itself into landscape, so
     instead we simply refuse to play in portrait and ask nicely. */
  #rotate {
    position: fixed;
    inset: 0;
    display: none;
    z-index: 9999;
    background: #3d6b2c;
    color: #f2e4c8;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 24px;
  }
  #rotate .phone {
    width: 64px;
    height: 104px;
    border: 5px solid #f2e4c8;
    border-radius: 12px;
    margin-bottom: 26px;
    animation: tip 2.2s ease-in-out infinite;
  }
  @keyframes tip {
    0%, 45%  { transform: rotate(0deg); }
    65%, 90% { transform: rotate(-90deg); }
    100%     { transform: rotate(0deg); }
  }
  #rotate h1 { font-size: 20px; margin: 0 0 8px; font-weight: 600; }
  #rotate p  { font-size: 14px; margin: 0; opacity: 0.75; line-height: 1.5; }

  @media (orientation: portrait) {
    #rotate { display: flex; }
  }
</style>
</head>
<body>
<div id="game"></div>

<div id="rotate">
  <div class="phone"></div>
  <h1>Turn your phone sideways</h1>
  <p>Prairie Village is played in landscape.<br>
     If it won't rotate, swipe down from the top-right<br>
     and switch off Rotation Lock.</p>
</div>

<script src="https://cdn.jsdelivr.net/npm/phaser@3.80.1/dist/phaser.min.js"></script>
<script src="game.js"></script>
</body>
</html>
